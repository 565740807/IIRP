# Normal product targets. Development probe budgets are separate.
[normal_usage]
timezone = "America/New_York"
initial_sec_business_days = 5
insider_history_months = 3
complete_historical_price_years = 8
include_current_year = true
max_tickers_per_batch = 20
sec_requests_per_second = 2
sec_concurrency = 2
market_concurrency = 1
sec_chunk_filings = 100
history_continues_from_checkpoints = true

[development_tests]
sec_pages_per_probe = 1
sec_items_per_page = 10
market_tickers_per_probe = 1
market_period = "5d"
provider_deadline_seconds = 25
source_cooldown_seconds = 60
failure_cooldown_seconds = 900
scheduled_probe_interval_minutes = 30
