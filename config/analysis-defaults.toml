# Per-feature analysis defaults. Each page can override them in place.
#
# n is the number of trading sessions shown before and after an event. For
# earnings and custom events the windows are centered on the reaction day R:
# before = C(R-1)/C(R-1-n) - 1, reaction = C(R)/C(R-1) - 1,
# after = C(R+n)/C(R) - 1.
[window_sessions]
insider = 5
earnings = 5
custom = 5

# Accepted range for an n passed to an analysis.
[window_sessions_limits]
min = 1
max = 60

# Insider overview (/insider). Display rules only; nothing here scores a trade.
[insider_overview]
# A price is checked against the trade day's close in the 24-hour daily cache,
# otherwise against the latest stock quote. When max(price / reference,
# reference / price) reaches this ratio the reported price is still shown, but
# the trade is left out of amount rankings, amount totals and company totals.
price_mismatch_ratio = 10
# Rows returned per list; each list also reports its full count.
cluster_rows = 20
large_rows = 10
executive_rows = 20
holding_rows = 20
company_page_rows = 50
# Unchecked prices among the first candidate_factor × rows of each ranking ask
# for a quote, at most max_quote_symbols per response, in one merged request.
candidate_factor = 3
max_quote_symbols = 200
