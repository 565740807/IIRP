# People followed by default: well-known investors and company leaders who file
# SEC Form 4, members of the House of Representatives, and the President and
# cabinet-level officials whose OGE 278-T reports are published.
#
# Reviewed every six months; last reviewed 2026-10. Edited by hand.
#
# Used once: when the followed list is empty and has never been filled, the
# list is filled from this file. After that the list in the database is the
# user's (adding and removing people there), and "Restore the default list"
# in Settings adds back the people below who were removed.
#
# Each person:
#   source    "sec" (Form 4 filer), "house" (House member) or "oge" (OGE 278-T filer)
#   cik       SEC filer number (sec only); matching uses the number, never the name
#   name      sec: the display name; house/oge: the name exactly as the disclosure
#             index writes it, which together with the district (house) or the
#             position (oge) identifies the person
#   district  house only, as the House index writes it (CA11)
#   position  oge only, as the OGE index writes it
#   display   display name, when it differs from name (house/oge only)
#   category  investor, investment_firm, founder_ceo, house, president, cabinet
#   note      one sentence on who the person is, in English and Chinese
#
# `python -m iirp.notable.people` checks this file: duplicates, missing
# identifiers and the CIK format.

