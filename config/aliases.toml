# Other names of stocks: Chinese names, former names and common short names.
#
# Edited by hand; never downloaded or generated. One alias per line, naming one or
# more codes (several share classes of one company are all listed). Codes are
# written as the index lists store them after "." becomes "-" (BRK.B is BRK-B).
# Matching ignores case, so "Google" also finds "google"; an alias may appear only
# once in any case. Company names already in the index lists (Alphabet, Nvidia …)
# need no alias: searches match them too.
#
# `python -m iirp.aliases` checks this file against the saved index lists.

