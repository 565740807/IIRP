# GICS structure: sector names and sub-industry → industry group, as published by
# MSCI and S&P Dow Jones Indices (the structure effective March 17, 2023: 11 sectors,
# 25 industry groups, 163 sub-industries).
#
# The names are written exactly as the S&P 500 list spells them. Sector and
# industry group ids are the ones in config/sector-map.toml, which supplies each
# group's ETF. [renamed] maps names used before the 2023 revision to their current
# industry group, so an older list still classifies.

[sectors]
"Energy" = "energy"
"Materials" = "materials"
"Industrials" = "industrials"
"Consumer Discretionary" = "consumer_discretionary"
"Consumer Staples" = "consumer_staples"
"Health Care" = "health_care"
"Financials" = "financials"
"Information Technology" = "information_technology"
"Communication Services" = "communication_services"
"Utilities" = "utilities"
"Real Estate" = "real_estate"

# 1010 Energy
[groups.energy]
sector = "energy"
sub_industries = [
  "Oil & Gas Drilling", "Oil & Gas Equipment & Services",
  "Integrated Oil & Gas", "Oil & Gas Exploration & Production", "Oil & Gas Refining & Marketing",
  "Oil & Gas Storage & Transportation", "Coal & Consumable Fuels",
]

# 1510 Materials
[groups.materials]
sector = "materials"
sub_industries = [
  "Commodity Chemicals", "Diversified Chemicals", "Fertilizers & Agricultural Chemicals",
  "Industrial Gases", "Specialty Chemicals",
  "Construction Materials",
  "Metal, Glass & Plastic Containers", "Paper & Plastic Packaging Products & Materials",
  "Aluminum", "Diversified Metals & Mining", "Copper", "Gold", "Precious Metals & Minerals", "Silver", "Steel",
  "Forest Products", "Paper Products",
]

# 2010 Capital Goods
[groups.capital_goods]
