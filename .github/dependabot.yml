version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      pip-all:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-frontend-all:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /browser
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm-browser-all:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions-all:
        patterns: ["*"]
