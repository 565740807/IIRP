name: Isolated candidate validation (manual, ~180 min)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: synthetic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Export actual source tree
        run: python3 scripts/release_candidates.py --output candidate
      - name: Full checks, clean install, browser, recovery, A14 B10 C100 and real HTTP 200
        working-directory: candidate
        run: python3 scripts/validate.py --suite full --output test-results/full
      - name: Synthetic evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-validation
          path: candidate/test-results/full/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
