name: Isolated candidate validation (manual, ~180 min)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: synthetic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Export actual source tree
        run: python3 scripts/release_candidates.py --output candidate
      - name: Full checks, clean install, browser, recovery, A14 B10 C100 and real HTTP 200
        working-directory: candidate
        run: python3 scripts/validate.py --suite full --output test-results/full
      - name: Synthetic evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-validation
          path: candidate/test-results/full/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
