name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly slow job; it only runs once the repository is public (see `visibility`).
    - cron: "17 6 * * 1"
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visibility:
    name: Repository visibility (scheduled runs only)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "public=$(gh api "repos/${{ github.repository }}" --jq '.private == false')" >> "$GITHUB_OUTPUT"
  backend:
    name: Backend (Ruff, pytest, OpenAPI)
    # A push to main in a private repository was already checked on its pull request.
    if: github.event_name != 'schedule' && !(github.event_name == 'push' && github.event.repository.private)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_USER: iirp
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: iirp_v1_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iirp -d iirp_v1_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_PASSWORD: ci-only-password
      IIRP_PG_BIN: /usr/lib/postgresql/18/bin
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test database and runtime directory
        run: |
          echo "IIRP_DATABASE_URL=postgresql+psycopg://iirp:${PG_PASSWORD}@127.0.0.1:5432/iirp_v1_test_ci" >> "$GITHUB_ENV"
          echo "IIRP_RUNTIME_DIR=${RUNNER_TEMP}/iirp-runtime" >> "$GITHUB_ENV"
      - name: Install the PostgreSQL client matching the server
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18
      - name: Install Tesseract OCR for scanned disclosure parsing
        run: sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.10
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check backend tests scripts migrations
      - name: pytest (without slow benchmarks)
        run: uv run python -m pytest tests -q -m "not slow"
      - name: OpenAPI matches the application
        run: uv run python scripts/check_openapi.py
  backend-slow:
    name: Backend capacity benchmarks (slow; manual or weekly)
    # Private repositories run it only manually to save Actions minutes; public ones weekly.
    needs: visibility
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.visibility.outputs.public == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_USER: iirp
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: iirp_v1_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iirp -d iirp_v1_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_PASSWORD: ci-only-password
      IIRP_PG_BIN: /usr/lib/postgresql/18/bin
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test database and runtime directory
        run: |
          echo "IIRP_DATABASE_URL=postgresql+psycopg://iirp:${PG_PASSWORD}@127.0.0.1:5432/iirp_v1_test_ci" >> "$GITHUB_ENV"
          echo "IIRP_RUNTIME_DIR=${RUNNER_TEMP}/iirp-runtime" >> "$GITHUB_ENV"
      - name: Install the PostgreSQL client matching the server
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18
      - name: Install Tesseract OCR for scanned disclosure parsing
        run: sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.10
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: pytest (slow benchmarks only)
        run: uv run python -m pytest tests -q -m slow
  frontend:
    name: Frontend (types, tests, build)
    # A push to main in a private repository was already checked on its pull request.
    if: github.event_name != 'schedule' && !(github.event_name == 'push' && github.event.repository.private)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated types match docs/openapi.json
        run: npm run check:api
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  e2e:
    name: End-to-end smoke (Playwright)
    # A push to main in a private repository was already checked on its pull request.
    if: github.event_name != 'schedule' && !(github.event_name == 'push' && github.event.repository.private)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_USER: iirp
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: iirp_v1_test_e2e
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql:rw,size=2g
          --health-cmd "pg_isready -U iirp -d iirp_v1_test_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_PASSWORD: ci-only-password
      IIRP_PG_BIN: /usr/lib/postgresql/18/bin
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.10
          python-version: "3.13"
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Isolated browser runtime
        run: |
          echo "IIRP_DATABASE_URL=postgresql+psycopg://iirp:${PG_PASSWORD}@127.0.0.1:5432/iirp_v1_test_e2e" >> "$GITHUB_ENV"
          echo "IIRP_RUNTIME_DIR=${RUNNER_TEMP}/iirp-e2e-runtime" >> "$GITHUB_ENV"
          echo "IIRP_E2E_OUTPUT_DIR=${RUNNER_TEMP}/iirp-e2e" >> "$GITHUB_ENV"
          echo "PYTHONPATH=.:backend" >> "$GITHUB_ENV"
      - run: uv sync --frozen
      - run: npm ci
        working-directory: frontend
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Smoke tests with intraday, after-close and weekend clocks
        run: uv run python -m scripts.e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-smoke
          path: ${{ runner.temp }}/iirp-e2e
          retention-days: 7
  secrets:
    name: Secret scan (gitleaks)
    # A push to main in a private repository was already checked on its pull request.
    if: github.event_name != 'schedule' && !(github.event_name == 'push' && github.event.repository.private)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner --verbose /repo
