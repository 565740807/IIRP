# Test-only overlay selected by the guarded ./iirp wrapper. No real providers.
services:
  postgres:
    labels: &validation-labels
      iirp.validation: ${IIRP_VALIDATION_ID:?validation identity required}
      iirp.validation.project: ${IIRP_COMPOSE_PROJECT:?validation project required}
  web:
    labels: *validation-labels
    build:
      labels: *validation-labels
    command: [python, -m, scripts.validation.installed]
    environment:
      IIRP_VALIDATION_ID: ${IIRP_VALIDATION_ID:?validation identity required}
  worker:
    labels: *validation-labels
    command: [python, -m, scripts.validation.worker]
    environment:
      IIRP_VALIDATION_ID: ${IIRP_VALIDATION_ID:?validation identity required}
volumes:
  postgres-data:
    labels: *validation-labels
  app-runtime:
    labels: *validation-labels
networks:
  default:
    labels: *validation-labels
