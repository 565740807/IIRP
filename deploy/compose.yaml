name: iirp-v1
services:
  postgres:
    init: true
    stop_grace_period: 35s
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_USER: iirp
      POSTGRES_PASSWORD: ${IIRP_DB_PASSWORD:?Set a private database password}
      POSTGRES_DB: ${IIRP_DB_NAME:-iirp_v1}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U iirp -d "$$POSTGRES_DB" -t 2']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # PGTune (PostgreSQL 18, web application, 2 GiB, 4 CPUs, 100 connections,
    # HDD). The page cache counts toward mem_limit, so effective_cache_size
    # assumes the remaining ~1.5 GiB of the container, not the host's memory.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - work_mem=4MB
      - -c
      - wal_buffers=16MB
      - -c
      - min_wal_size=1GB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=4
      - -c
      - effective_io_concurrency=2
      - -c
      - max_worker_processes=4
      - -c
      - max_parallel_workers_per_gather=2
      - -c
      - max_parallel_workers=4
      - -c
      - max_parallel_maintenance_workers=2
    shm_size: 256m
    mem_limit: 2g
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${IIRP_APP_IMAGE:-iirp-v1-app:0.1.0}
    command: [sh, -c, 'python -m alembic upgrade head && exec python -m uvicorn iirp.api:app --host 0.0.0.0 --port 18081']
    environment: &app-env
      IIRP_DATABASE_URL: postgresql+psycopg://iirp:${IIRP_DB_PASSWORD}@postgres:5432/${IIRP_DB_NAME:-iirp_v1}
      IIRP_RUNTIME_DIR: /app/runtime
      IIRP_MODE: development
      IIRP_SEC_USER_AGENT: ${IIRP_SEC_USER_AGENT:-}
      IIRP_PG_BIN: /usr/lib/postgresql/18/bin
    volumes:
      - app-runtime:/app/runtime
    ports:
      - '127.0.0.1:${IIRP_HTTP_PORT:-18081}:18081'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18081/health/ready',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 768m
  worker:
    image: ${IIRP_APP_IMAGE:-iirp-v1-app:0.1.0}
    command: [python, -m, iirp.worker]
    environment: *app-env
    volumes:
      - app-runtime:/app/runtime
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 35s
    mem_limit: 1g
volumes:
  postgres-data:
  app-runtime:
