[project]
name = "iirp-v1"
version = "0.1.0"
description = "IIRP V1 local development foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<2.2",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "httpx>=0.28,<1",
  "defusedxml>=0.7,<1",
  "yfinance>=0.2.65,<2",
  "exchange-calendars>=4.11,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/iirp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
markers = ["slow: 大型容量/基准用例；快速 CI 用 -m \"not slow\" 跳过，定时与手动作业运行"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
